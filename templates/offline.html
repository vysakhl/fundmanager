<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16233F">
<title>Offline — Money Mafia</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5EFE0;color:#16233F;font-family:system-ui,sans-serif;text-align:center;padding:24px;}
  .card{max-width:340px;}
  .mark{width:52px;height:52px;border-radius:50%;border:2px solid #B07D2A;color:#B07D2A;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 14px;}
  a{display:inline-block;margin-top:14px;padding:11px 24px;background:#B07D2A;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;}
  p{color:#5b6577;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <div class="mark">₹</div>
  <h2>You're offline</h2>
  <p>Money Mafia needs an internet connection to show live fund data. Check your connection — if the server was asleep, wait a minute and try again.</p>
  <a href="/">Try again</a>
</div>
</body>
</html>
