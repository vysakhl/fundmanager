{% extends 'base.html' %}
{% block content %}
<div class="page-head"><h2>Settings</h2><div class="sub">Configure fund parameters</div></div>
<div class="panel">
  <h3>Fund Parameters</h3>
  <form method="post" action="{{ url_for('settings_view') }}">
    <div class="row">
      <div class="field"><label>Monthly Contribution (₹)</label><input name="contribution" type="number" value="{{ settings.contribution }}"></div>
      <div class="field"><label>Lottery Prize (₹)</label><input name="lottery" type="number" value="{{ settings.lottery }}"></div>
      <div class="field"><label>Lottery Day of Month</label><input name="lottery_day" type="number" min="1" max="28" value="{{ settings.lottery_day }}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Per-Member Debit Limit (₹)</label><input name="debit_limit" type="number" value="{{ settings.debit_limit }}"></div>
      <div class="field"><label>Base Interest Rate (% per month, doubles each month unpaid)</label><input name="interest_rate" type="number" step="0.1" value="{{ settings.interest_rate }}"></div>
    </div>
    <button class="btn brass" type="submit">Save Settings</button>
  </form>
</div>
<div class="panel">
  <h3>Savings Fund Balance</h3>
  <div class="hint" style="margin-bottom:10px;">The balance updates automatically as contributions, debits, repayments and lottery payouts are recorded. You can also set or correct it manually here.</div>
  <form method="post" action="{{ url_for('update_fund_balance') }}">
    <div class="row">
      <div class="field"><label>Fund Balance (₹)</label><input name="fund_balance" type="number" value="{{ settings.fund_balance }}"></div>
    </div>
    <button class="btn ghost" type="submit">Update Balance</button>
  </form>
</div>
{% endblock %}
